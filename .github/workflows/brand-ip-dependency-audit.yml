name: BRafaelS Python package license audit
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dependency-licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Python dependency licenses
        run: |
          python -m pip install -r requirements.txt pip-licenses
          python -m piplicenses --from=mixed --format=plain
